name: Fix Gradle Wrapper + Build APK

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Generate wrapper
        run: gradle wrapper

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Pull Request (wrapper fix only)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Restore Gradle wrapper"
          title: "Restore Gradle wrapper"
          body: "Auto-generated Gradle wrapper restore"
          branch: fix/gradle-wrapper
          base: main
          add-paths: |
            gradlew
            gradlew.bat
            gradle/wrapper/
